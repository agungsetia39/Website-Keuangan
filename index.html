<script>
// ===== INIT =====
let data = JSON.parse(localStorage.getItem("keuangan")) || [];

// ===== SIMPAN =====
function simpan() {
    localStorage.setItem("keuangan", JSON.stringify(data));
}

// ===== FORMAT =====
function formatRupiah(angka) {
    return "Rp. " + (angka || 0).toLocaleString("id-ID");
}

// ===== TAMBAH =====
function tambah() {
    let ketEl = document.getElementById("ket");
    let tipeEl = document.getElementById("tipe");
    let nominalEl = document.getElementById("nominal");
    let tanggalEl = document.getElementById("tanggal");

    let ket = ketEl.value;
    let tipe = tipeEl.value;
    let nominal = nominalEl.value;
    let tanggal = tanggalEl.value;

    if (!ket || !nominal || !tanggal) {
        alert("Lengkapi data!");
        return;
    }

    data.push({
        ket: ket,
        tipe: tipe,
        nominal: parseInt(nominal),
        tanggal: tanggal
    });

    simpan();

    // reset input
    ketEl.value = "";
    nominalEl.value = "";
    tanggalEl.value = "";

    render();
}

// ===== RENDER + FILTER =====
function render() {
    let table = document.getElementById("tableData");
    if (!table) return; // biar aman kalau halaman belum tampil

    table.innerHTML = "";

    let totalMasuk = 0;
    let totalKeluar = 0;

    let search = (document.getElementById("search")?.value || "").toLowerCase();
    let dari = document.getElementById("dari")?.value;
    let sampai = document.getElementById("sampai")?.value;

    data.forEach((d, i) => {

        let cocokSearch = d.ket.toLowerCase().includes(search);
        let cocokTanggal = true;

        if (dari && !sampai) cocokTanggal = d.tanggal >= dari;
        else if (!dari && sampai) cocokTanggal = d.tanggal <= sampai;
        else if (dari && sampai) cocokTanggal = d.tanggal >= dari && d.tanggal <= sampai;

        if (!cocokSearch || !cocokTanggal) return;

        if (d.tipe === "masuk") totalMasuk += d.nominal;
        else totalKeluar += d.nominal;

        table.innerHTML += `
        <tr>
            <td>${d.ket}</td>
            <td class="${d.tipe === 'masuk' ? 'pemasukan' : 'pengeluaran'}">${d.tipe}</td>
            <td>${formatRupiah(d.nominal)}</td>
            <td>${d.tanggal}</td>
            <td><button class="delete-btn" onclick="hapus(${i})">Hapus</button></td>
        </tr>`;
    });

    document.getElementById("masuk").innerText = formatRupiah(totalMasuk);
    document.getElementById("keluar").innerText = formatRupiah(totalKeluar);
    document.getElementById("saldo").innerText = formatRupiah(totalMasuk - totalKeluar);

    let persen = totalMasuk > 0 ? (totalKeluar / totalMasuk * 100).toFixed(1) : 0;
    document.getElementById("persenKeluar").innerText = persen + "% dari pemasukan";
}

// ===== HAPUS =====
function hapus(i) {
    data.splice(i, 1);
    simpan();
    render();
}

// ===== RESET =====
function resetData() {
    if (confirm("Yakin hapus semua data?")) {
        localStorage.removeItem("keuangan");
        data = [];
        render();
    }
}

// ===== INIT EVENT =====
document.addEventListener("DOMContentLoaded", () => {
    let searchEl = document.getElementById("search");
    if (searchEl) {
        searchEl.addEventListener("keyup", render);
    }
    render();
});
</script>
