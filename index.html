<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan Rumah Tangga</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 95%;
    max-width: 1000px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 25px;
    color: white;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 10px;
    margin-bottom: 20px;
}

input, select {
    padding: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    background: #00c9a7;
    border: none;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    background: #00b894;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: rgba(255,255,255,0.2);
}

th, td {
    padding: 10px;
    text-align: center;
}

tr:hover {
    background: rgba(255,255,255,0.1);
}

.pemasukan { color: #00ffae; }
.pengeluaran { color: #ff7675; }

.summary {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.card {
    flex: 1;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
}

.masuk { background: rgba(0,255,150,0.2); }
.keluar { background: rgba(255,0,0,0.2); }
.saldo { background: rgba(0,150,255,0.2); }

.delete-btn {
    background: red;
}
small {
    opacity: 0.8;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>Keuangan Rumah Tangga</h1>
    </div>

    <div class="form">
        <input type="text" id="ket" placeholder="Keterangan">
        <select id="tipe">
            <option value="masuk">Pemasukan</option>
            <option value="keluar">Pengeluaran</option>
        </select>
        <input type="number" id="nominal" placeholder="Nominal">
        <input type="date" id="tanggal">
        <button onclick="tambah()">Tambah</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Keterangan</th>
                <th>Tipe</th>
                <th>Nominal</th>
                <th>Tanggal</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tableData"></tbody>
    </table>

    <div class="summary">
        <div class="card masuk">
            <h3>Pemasukan</h3>
            <span id="masuk">0</span>
        </div>
        <div class="card keluar">
            <h3>Pengeluaran</h3>
            <span id="keluar">0</span><br>
            <small id="persenKeluar">0%</small>
        </div>
        <div class="card saldo">
            <h3>Saldo</h3>
            <span id="saldo">0</span>
        </div>
    </div>
</div>

<script>
let data = [];

// FORMAT RUPIAH
function formatRupiah(angka) {
    return "Rp. " + angka.toLocaleString("id-ID");
}

function tambah() {
    let ket = document.getElementById("ket").value;
    let tipe = document.getElementById("tipe").value;
    let nominal = document.getElementById("nominal").value;
    let tanggal = document.getElementById("tanggal").value;

    if (!ket || !nominal || !tanggal) {
        alert("Lengkapi data!");
        return;
    }

    data.push({ ket, tipe, nominal: parseInt(nominal), tanggal });

    document.getElementById("ket").value = "";
    document.getElementById("nominal").value = "";
    document.getElementById("tanggal").value = "";

    render();
}

function render() {
    let table = document.getElementById("tableData");
    table.innerHTML = "";

    let masuk = 0;
    let keluar = 0;

    data.forEach((d, i) => {
        if (d.tipe === "masuk") masuk += d.nominal;
        else keluar += d.nominal;

        table.innerHTML += `
        <tr>
            <td>${d.ket}</td>
            <td class="${d.tipe === 'masuk' ? 'pemasukan' : 'pengeluaran'}">${d.tipe}</td>
            <td>${formatRupiah(d.nominal)}</td>
            <td>${d.tanggal}</td>
            <td><button class="delete-btn" onclick="hapus(${i})">Hapus</button></td>
        </tr>
        `;
    });

    // tampilkan total
    document.getElementById("masuk").innerText = formatRupiah(masuk);
    document.getElementById("keluar").innerText = formatRupiah(keluar);
    document.getElementById("saldo").innerText = formatRupiah(masuk - keluar);

    // persen hanya pengeluaran
    let persenKeluar = masuk > 0 ? (keluar / masuk * 100).toFixed(1) : 0;
    document.getElementById("persenKeluar").innerText = persenKeluar + "% dari pemasukan";
}

function hapus(i) {
    data.splice(i, 1);
    render();
}
</script>

</body>
</html>
