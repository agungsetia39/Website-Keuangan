<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
}

/* PAGE */
.page{display:none;}
.active{display:block;}

/* LOGIN */
.login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.login-box{
    background:white;
    color:black;
    padding:30px;
    border-radius:15px;
    width:300px;
    text-align:center;
}

/* DASHBOARD */
.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}
.card{
    background:rgba(255,255,255,0.1);
    padding:20px;
    border-radius:20px;
    text-align:center;
}
img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
}

/* KEUANGAN (ASLI KAMU - TIDAK DIUBAH) */
.box {
    margin-bottom:20px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,0.15);
}
.form {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    align-items:end;
}
.input-group {
    display:flex;
    flex-direction:column;
}
.input-group label {
    font-size:12px;
    margin-bottom:3px;
    opacity:0.8;
}
input, select, button {
    height:42px;
    padding:0 10px;
    border-radius:10px;
    border:none;
}
button {
    background:#00c9a7;
    color:white;
    cursor:pointer;
    padding:0 15px;
}
button:hover {
    transform:scale(1.05);
    background:#00b894;
}
table {width:100%;border-collapse:collapse;}
th {background:rgba(255,255,255,0.2);}
th,td {padding:10px;text-align:center;}
tr:hover {background:rgba(255,255,255,0.1);}
.pemasukan {color:#00ffae;}
.pengeluaran {color:#ff7675;}
.summary {display:flex;gap:10px;margin-top:20px;}
.card2 {flex:1;padding:15px;border-radius:15px;text-align:center;}
.masuk {background:rgba(0,255,150,0.2);}
.keluar {background:rgba(255,0,0,0.2);}
.saldo {background:rgba(0,150,255,0.2);}
.delete-btn {background:red;}
small {font-size:12px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="page login active">
<div class="login-box">
<h2>Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage" class="page">
<div class="container">
<h1>Dashboard</h1>

<div class="card">
<img id="foto" src="https://i.imgur.com/6VBx3io.png">
<br><br>
<input type="file" onchange="gantiFoto(event)">
<h3>Selamat datang</h3>

<button onclick="showPage('keuanganPage')">Masuk Keuangan</button>
<button onclick="logout()">Logout</button>
</div>

</div>
</div>

<!-- KEUANGAN -->
<div id="keuanganPage" class="page">
<div class="container">

<button onclick="showPage('dashboardPage')">⬅ Kembali</button>

<h1 style="text-align:center;margin-bottom:20px;">Keuangan Rumah Tangga</h1>

<div class="box">
<h3>Tambah Data</h3>
<div class="form">
<input type="text" id="ket" placeholder="Keterangan">
<select id="tipe">
<option value="masuk">Pemasukan</option>
<option value="keluar">Pengeluaran</option>
</select>
<input type="number" id="nominal" placeholder="Nominal">
<input type="date" id="tanggal">
<button onclick="tambah()">Tambah</button>
</div>
</div>

<div class="box">
<h3>Filter & Pencarian</h3>
<div class="form">
<input type="text" id="search" placeholder="Cari keterangan...">

<div class="input-group">
<label>Mulai</label>
<input type="date" id="dari">
</div>

<div class="input-group">
<label>Sampai</label>
<input type="date" id="sampai">
</div>

<button onclick="render()">Filter</button>
</div>
</div>

<table>
<thead>
<tr>
<th>Keterangan</th>
<th>Tipe</th>
<th>Nominal</th>
<th>Tanggal</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tableData"></tbody>
</table>

<div class="summary">
<div class="card2 masuk">
<h3>Pemasukan</h3>
<span id="masuk">0</span>
</div>

<div class="card2 keluar">
<h3>Pengeluaran</h3>
<span id="keluar">0</span><br>
<small id="persenKeluar">0%</small>
</div>

<div class="card2 saldo">
<h3>Saldo</h3>
<span id="saldo">0</span>
</div>
</div>

</div>
</div>

<script>
// NAVIGASI
function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// LOGIN
function login(){
    if(user.value==="admin" && pass.value==="123"){
        showPage('dashboardPage');
    } else {
        alert("Login salah!");
    }
}

function logout(){
    showPage('loginPage');
}

// FOTO
function gantiFoto(e){
    let reader=new FileReader();
    reader.onload=()=>foto.src=reader.result;
    reader.readAsDataURL(e.target.files[0]);
}

// DATA KEUANGAN (ASLI KAMU)
let data = [];

function formatRupiah(angka) {
    return "Rp. " + angka.toLocaleString("id-ID");
}

function tambah() {
    let ket = document.getElementById("ket").value;
    let tipe = document.getElementById("tipe").value;
    let nominal = document.getElementById("nominal").value;
    let tanggal = document.getElementById("tanggal").value;

    if (!ket || !nominal || !tanggal) {
        alert("Lengkapi data!");
        return;
    }

    data.push({ ket, tipe, nominal: parseInt(nominal), tanggal });

    ket.value=""; nominal.value=""; tanggal.value="";
    render();
}

function render() {
    let table = document.getElementById("tableData");
    table.innerHTML = "";

    let masuk = 0;
    let keluar = 0;

    let search = document.getElementById("search").value.toLowerCase();
    let dari = document.getElementById("dari").value;
    let sampai = document.getElementById("sampai").value;

    data.forEach((d, i) => {

        let cocokSearch = d.ket.toLowerCase().includes(search);
        let cocokTanggal = true;

        if (dari && !sampai) cocokTanggal = d.tanggal >= dari;
        else if (!dari && sampai) cocokTanggal = d.tanggal <= sampai;
        else if (dari && sampai) cocokTanggal = d.tanggal >= dari && d.tanggal <= sampai;

        if (!cocokSearch || !cocokTanggal) return;

        if (d.tipe === "masuk") masuk += d.nominal;
        else keluar += d.nominal;

        table.innerHTML += `
        <tr>
            <td>${d.ket}</td>
            <td class="${d.tipe === 'masuk' ? 'pemasukan' : 'pengeluaran'}">${d.tipe}</td>
            <td>${formatRupiah(d.nominal)}</td>
            <td>${d.tanggal}</td>
            <td><button class="delete-btn" onclick="hapus(${i})">Hapus</button></td>
        </tr>`;
    });

    document.getElementById("masuk").innerText = formatRupiah(masuk);
    document.getElementById("keluar").innerText = formatRupiah(keluar);
    document.getElementById("saldo").innerText = formatRupiah(masuk - keluar);

    let persenKeluar = masuk > 0 ? (keluar / masuk * 100).toFixed(1) : 0;
    document.getElementById("persenKeluar").innerText = persenKeluar + "% dari pemasukan";
}

document.getElementById("search").addEventListener("keyup", render);

function hapus(i) {
    data.splice(i, 1);
    render();
}

render();
</script>

</body>
</html>
