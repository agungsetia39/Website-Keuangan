<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
}

.page{display:none;}
.active{display:block;}

.login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    color:black;
    padding:30px;
    border-radius:15px;
    text-align:center;
    width:300px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:20px;
    border-radius:20px;
    text-align:center;
}

img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
}

.box{
    margin-bottom:20px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,0.15);
}

.form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    align-items:end;
}

input,select,button{
    height:42px;
    border:none;
    border-radius:10px;
    padding:0 10px;
}

button{
    background:#00c9a7;
    color:white;
    cursor:pointer;
}

table{width:100%;border-collapse:collapse;}
th,td{padding:10px;text-align:center;}
th{background:rgba(255,255,255,0.2);}

.summary{display:flex;gap:10px;margin-top:20px;}
.card2{flex:1;padding:10px;border-radius:10px;text-align:center;}
.masuk{background:rgba(0,255,150,0.2);}
.keluar{background:rgba(255,0,0,0.2);}
.saldo{background:rgba(0,150,255,0.2);}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="page login active">
<div class="login-box">
<h2>Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage" class="page">
<div class="container">
<h1>Dashboard</h1>

<div class="card">
<img id="foto" src="https://i.imgur.com/6VBx3io.png">
<br><br>
<input type="file" onchange="gantiFoto(event)">
<h3>Selamat datang</h3>
<button onclick="showPage('keuanganPage')">Masuk Keuangan</button>
<button onclick="logout()">Logout</button>
</div>

</div>
</div>

<!-- KEUANGAN -->
<div id="keuanganPage" class="page">
<div class="container">

<button onclick="showPage('dashboardPage')">⬅ Kembali</button>

<h2>Keuangan Rumah Tangga</h2>

<div class="box">
<h3>Tambah Data</h3>
<div class="form">
<input id="ket" placeholder="Keterangan">
<select id="tipe">
<option value="masuk">Masuk</option>
<option value="keluar">Keluar</option>
</select>
<input id="nominal" type="number">
<input id="tanggal" type="date">
<button onclick="tambah()">Tambah</button>
</div>
</div>

<div class="box">
<h3>Filter</h3>
<div class="form">
<input id="search" placeholder="Cari...">
<input id="dari" type="date">
<input id="sampai" type="date">
<button onclick="render()">Filter</button>
</div>
</div>

<table>
<tr>
<th>Keterangan</th>
<th>Tipe</th>
<th>Nominal</th>
<th>Tanggal</th>
<th>Aksi</th>
</tr>
<tbody id="tableData"></tbody>
</table>

<div class="summary">
<div class="card2 masuk"><h3 id="masuk">0</h3></div>
<div class="card2 keluar"><h3 id="keluar">0</h3></div>
<div class="card2 saldo"><h3 id="saldo">0</h3></div>
</div>

</div>
</div>

<script>
function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function login(){
    if(user.value==="admin" && pass.value==="123"){
        showPage('dashboardPage');
    } else alert("Username / Password salah");
}

function logout(){
    showPage('loginPage');
}

// FOTO
function gantiFoto(e){
    let reader=new FileReader();
    reader.onload=()=>foto.src=reader.result;
    reader.readAsDataURL(e.target.files[0]);
}

// DATA
let data=[];

function formatRupiah(a){return "Rp."+a.toLocaleString("id-ID");}

function tambah(){
    if(!ket.value || !nominal.value || !tanggal.value){
        alert("Isi semua data!");
        return;
    }

    data.push({
        ket:ket.value,
        tipe:tipe.value,
        nominal:parseInt(nominal.value),
        tanggal:tanggal.value
    });

    ket.value=""; nominal.value=""; tanggal.value="";
    render();
}

function render(){
    let masuk=0, keluar=0;
    tableData.innerHTML="";

    let s = search.value.toLowerCase();
    let d1 = dari.value;
    let d2 = sampai.value;

    data.forEach((d,i)=>{

        let cocokSearch = d.ket.toLowerCase().includes(s);
        let cocokTanggal = true;

        if(d1 && !d2) cocokTanggal = d.tanggal >= d1;
        else if(!d1 && d2) cocokTanggal = d.tanggal <= d2;
        else if(d1 && d2) cocokTanggal = d.tanggal >= d1 && d.tanggal <= d2;

        if(!cocokSearch || !cocokTanggal) return;

        if(d.tipe==="masuk") masuk+=d.nominal;
        else keluar+=d.nominal;

        tableData.innerHTML+=`
        <tr>
        <td>${d.ket}</td>
        <td>${d.tipe}</td>
        <td>${formatRupiah(d.nominal)}</td>
        <td>${d.tanggal}</td>
        <td><button onclick="hapus(${i})">Hapus</button></td>
        </tr>`;
    });

    masuk.innerText=formatRupiah(masuk);
    keluar.innerText=formatRupiah(keluar);
    saldo.innerText=formatRupiah(masuk-keluar);
}

function hapus(i){
    data.splice(i,1);
    render();
}

// realtime search
search.addEventListener("keyup", render);
</script>

</body>
</html>
